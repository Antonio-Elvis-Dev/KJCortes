[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kjcortes"
version = "0.1.0"
description = "Cortes automáticos, verticais e legendados de lives e vídeos de streamers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.10.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
chat = ["chat-downloader>=0.2.8"]
ia = ["anthropic>=0.40.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kjcortes = "kjcortes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kjcortes.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
