# Copie para config.yaml e ajuste. Todos os campos são opcionais.

pastas:
  cache: cache          # vídeos baixados, áudio, transcrições e chat
  dados: dados          # banco do painel (streamers, autorizações, cortes) e provas
  saida: saida          # cortes finais (.mp4 + .json)

transcricao:
  provedor: local       # local (faster-whisper, usa a GPU) ou api (para VPS sem GPU)
  modelo: large-v3      # tiny, base, small, medium, large-v3, large-v3-turbo
  dispositivo: auto     # auto, cuda ou cpu
  idioma: pt            # deixe vazio para detectar automaticamente
  # Com provedor: api. A chave vai na variável de ambiente TRANSCRICAO_API_KEY.
  api_url: https://api.groq.com/openai/v1   # ou https://api.openai.com/v1
  api_modelo: whisper-large-v3-turbo        # na OpenAI: whisper-1

cortes:
  quantidade: 5         # quantos cortes gerar por vídeo
  duracao_min: 20       # segundos
  duracao_max: 60       # segundos
  intervalo_min: 30     # distância mínima entre dois cortes, em segundos

pontuacao:              # peso de cada sinal na escolha dos trechos
  audio: 1.0            # picos de volume (gritos, risadas)
  chat: 1.5             # picos de mensagens no chat
  fala: 0.5             # densidade de fala
  ia: 2.0               # nota dada pela IA à transcrição (precisa de ANTHROPIC_API_KEY)

ia:
  ativa: false
  modelo: claude-sonnet-5-5
  max_candidatos: 20    # quantos trechos pré-selecionados a IA avalia

video:
  layout: desfoque      # desfoque (vídeo inteiro + fundo desfocado) ou centro (recorte central)
  largura: 1080
  altura: 1920
  encoder: auto         # auto (usa NVENC se houver GPU NVIDIA), h264_nvenc ou libx264

legenda:
  fonte: Montserrat ExtraBold
  tamanho: 84
  palavras_por_linha: 3
  cor: "&H00FFFFFF"       # branco (formato ASS: &HAABBGGRR)
  cor_destaque: "&H0000E5FF"  # amarelo na palavra falada
  posicao_vertical: 0.70  # 0 = topo, 1 = base

redes:
  # Endereço do painel usado nos retornos de login (redirect URI). Vazio = o endereço aberto no navegador.
  url_painel: ""
  youtube:
    client_secret: ""       # vazio = dados/youtube_client_secret.json
    privacidade_padrao: public
    categoria: "20"         # 20 = Jogos
  tiktok:
    client_key: ""          # ou variável de ambiente TIKTOK_CLIENT_KEY
    client_secret: ""       # ou TIKTOK_CLIENT_SECRET
  # Instagram: conectado colando o token no painel (página Contas).
